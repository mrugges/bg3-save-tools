[package]
name = "bg3-save-tools"
version = "0.1.0"
authors = ["mrugge <mrugges@gmail.com>"]
edition = "2024"
description = "Baldur's Gate 3 Honour Mode save tools: back up, restore and revive Honour runs"
license = "MIT"

[dependencies]
chrono = "0.4"
clap = { version = "4.5.41", features = ["derive", "env"] }
dirs = "6.0.0"
eframe = "0.31.1"
regex = "1.11.1"
rfd = "0.15"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.12.1", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
